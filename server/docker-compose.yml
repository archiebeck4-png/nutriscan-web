version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutriscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutriscan_secret}
      POSTGRES_DB: nutriscan
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://nutriscan:${POSTGRES_PASSWORD:-nutriscan_secret}@db:5432/nutriscan
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PORT: 3001

volumes:
  pgdata:
